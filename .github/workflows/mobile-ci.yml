name: Mobile CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Type-check and build web assets
        run: npm run build

      - name: Validate release metadata consistency
        run: npm run build:metadata

      - name: Validate Capacitor Android sync
        run: npx cap sync android

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: chatpalez-build-metadata
          path: artifacts/build-metadata.json
          retention-days: 7
