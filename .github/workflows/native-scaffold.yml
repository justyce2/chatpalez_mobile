name: Native Scaffold Validation

on:
  push:
    branches:
      - develop
    paths:
      - package.json
      - capacitor.config.ts
      - src/**
      - android/**
      - ios/**
      - .github/workflows/native-scaffold.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_APP_ID: com.chatpalez
  ONESIGNAL_DISABLE_LOCATION: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Ensure Android identity and project
        run: |
          if [ -f android/app/build.gradle ] && ! grep -q "applicationId \"${EXPECTED_APP_ID}\"" android/app/build.gradle; then
            echo "Android app id changed; regenerating native project."
            rm -rf android
          fi
          if [ ! -d android ]; then
            CAP_APP_ID="${EXPECTED_APP_ID}" npx cap add android
          fi

      - name: Sync Android project
        run: CAP_APP_ID="${EXPECTED_APP_ID}" npx cap sync android

      - name: Verify Android identity
        run: |
          grep -q "namespace = \"${EXPECTED_APP_ID}\"" android/app/build.gradle
          grep -q "applicationId \"${EXPECTED_APP_ID}\"" android/app/build.gradle

      - name: Compile Android debug app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: chatpalez-android-scaffold
          path: android
          retention-days: 7

  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies and sync Android
        run: |
          npm install
          npm run build
          CAP_APP_ID="${EXPECTED_APP_ID}" npx cap sync android
          chmod +x android/gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Ensure iOS identity and project
        run: |
          if [ -f ios/App/App.xcodeproj/project.pbxproj ] && ! grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${EXPECTED_APP_ID};" ios/App/App.xcodeproj/project.pbxproj; then
            echo "iOS bundle id changed; regenerating native project."
            rm -rf ios
          fi
          if [ ! -d ios ]; then
            CAP_APP_ID="${EXPECTED_APP_ID}" npx cap add ios
          fi

      - name: Sync iOS project
        run: CAP_APP_ID="${EXPECTED_APP_ID}" npx cap sync ios

      - name: Verify iOS identity
        run: grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${EXPECTED_APP_ID};" ios/App/App.xcodeproj/project.pbxproj

      - name: Validate Xcode project without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: chatpalez-ios-scaffold
          path: ios
          retention-days: 7

  persist:
    if: github.event_name == 'push'
    needs:
      - android
      - ios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Download Android scaffold
        uses: actions/download-artifact@v4
        with:
          name: chatpalez-android-scaffold
          path: android

      - name: Download iOS scaffold
        uses: actions/download-artifact@v4
        with:
          name: chatpalez-ios-scaffold
          path: ios

      - name: Commit validated native projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios
          if git diff --cached --quiet; then
            echo "Native projects already match the validated output."
            exit 0
          fi
          git commit -m "chore: sync validated Android and iOS projects"
          git push origin HEAD:develop
