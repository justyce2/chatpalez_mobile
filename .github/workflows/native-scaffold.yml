name: Native Scaffold Validation

on:
  push:
    branches:
      - develop
    paths:
      - package.json
      - capacitor.config.ts
      - src/**
      - android/**
      - ios/**
      - .github/workflows/native-scaffold.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPECTED_APP_ID: com.chatpalez
  ONESIGNAL_DISABLE_LOCATION: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Verify Android project exists and identity matches
        run: |
          test -d android
          grep -q "namespace = \"${EXPECTED_APP_ID}\"" android/app/build.gradle
          grep -q "applicationId \"${EXPECTED_APP_ID}\"" android/app/build.gradle

      - name: Sync Android project
        run: CAP_APP_ID="${EXPECTED_APP_ID}" npx cap sync android

      - name: Verify Android identity and security policy after sync
        run: |
          grep -q "namespace = \"${EXPECTED_APP_ID}\"" android/app/build.gradle
          grep -q "applicationId \"${EXPECTED_APP_ID}\"" android/app/build.gradle
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="chatpalez" android:host="open"' android/app/src/main/AndroidManifest.xml
          if grep -q 'android.permission.ACCESS_FINE_LOCATION\|android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml; then
            echo "Unexpected Android location permission detected."
            exit 1
          fi

      - name: Compile Android debug and release variants
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: chatpalez-android-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7

  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies and sync Android
        run: |
          npm install
          npm run build
          CAP_APP_ID="${EXPECTED_APP_ID}" npx cap sync android
          chmod +x android/gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android runtime integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Verify iOS project exists and identity matches
        run: |
          test -d ios
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${EXPECTED_APP_ID};" ios/App/App.xcodeproj/project.pbxproj

      - name: Sync iOS project
        run: CAP_APP_ID="${EXPECTED_APP_ID}" npx cap sync ios

      - name: Verify iOS identity and deep link scheme after sync
        run: |
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${EXPECTED_APP_ID};" ios/App/App.xcodeproj/project.pbxproj
          grep -q '<string>chatpalez</string>' ios/App/App/Info.plist
          if grep -q '<key>NSAllowsArbitraryLoads</key>' ios/App/App/Info.plist; then
            echo "Unexpected iOS App Transport Security override detected."
            exit 1
          fi

      - name: Validate Xcode project without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
