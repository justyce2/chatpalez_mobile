name: Native Scaffold Validation

on:
  push:
    branches:
      - develop
    paths:
      - package.json
      - capacitor.config.ts
      - src/**
      - android/**
      - ios/**
      - .github/workflows/native-scaffold.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Ensure Android project exists
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Compile Android debug app
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: chatpalez-android-scaffold
          path: android
          retention-days: 7

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Ensure iOS project exists
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Validate Xcode project without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: chatpalez-ios-scaffold
          path: ios
          retention-days: 7

  persist:
    if: github.event_name == 'push'
    needs:
      - android
      - ios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Download Android scaffold
        uses: actions/download-artifact@v4
        with:
          name: chatpalez-android-scaffold
          path: android

      - name: Download iOS scaffold
        uses: actions/download-artifact@v4
        with:
          name: chatpalez-ios-scaffold
          path: ios

      - name: Commit validated native projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios
          if git diff --cached --quiet; then
            echo "Native scaffolds already match the validated output."
            exit 0
          fi
          git commit -m "chore: sync validated Android and iOS projects"
          git push origin HEAD:develop
