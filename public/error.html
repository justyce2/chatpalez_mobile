<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ChatPalez — Connection problem</title>
  <style>
    html, body { margin: 0; min-height: 100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #171717; }
    body { min-height: 100vh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; }
    main { max-width: 420px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 1.5rem; }
    p { margin: 0 0 20px; line-height: 1.55; color: #555; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>ChatPalez couldn't connect</h1>
    <p>Check your internet connection and try again. If the problem continues, the ChatPalez service may be temporarily unavailable.</p>
    <button type="button" onclick="window.location.href='https://chatpalez.com'">Try again</button>
  </main>
</body>
</html>
